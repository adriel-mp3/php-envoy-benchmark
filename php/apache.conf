ServerName php

# Workers fixos: a aplicação não depende do servidor PHP de uma única thread.
ServerLimit 16
StartServers 16
MinSpareServers 16
MaxSpareServers 16
MaxRequestWorkers 16
MaxConnectionsPerChild 0
KeepAlive On
MaxKeepAliveRequests 0
KeepAliveTimeout 1

<VirtualHost *:80>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        FallbackResource /index.php
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /dev/null combined
</VirtualHost>
